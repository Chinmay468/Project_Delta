name: Daily YouTube Just Nature Scheduler

on:
  schedule:
    # 13:00 UTC is 18:30 IST (6:30 PM IST) -- Golden peak hour for nature/travel shorts
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run check (verify download and auth without uploading)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc-ares2 libcrypto++8 libmediainfo0v5 libzen0v5 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests python-dotenv

      - name: Install MEGAcmd
        run: |
          wget -q https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo dpkg -i megacmd-xUbuntu_22.04_amd64.deb || sudo apt-get -f install -y -qq

      - name: Publish Next Nature Short
        env:
          YOUTUBE_TOKEN_JUST_NATURE: ${{ secrets.YOUTUBE_TOKEN_JUST_NATURE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/youtube_cloud_publisher.py --channel just_nature --dry-run
          else
            python scripts/youtube_cloud_publisher.py --channel just_nature --post-next
          fi
