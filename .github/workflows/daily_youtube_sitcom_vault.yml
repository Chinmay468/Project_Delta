name: Daily YouTube Sitcom Vault Scheduler

on:
  schedule:
    # 14:05 UTC is 19:35 IST (7:35 PM IST) -- Peak evening comedy browsing
    - cron: '5 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run check (verify download and auth without uploading)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc-ares2 libcrypto++8 libmediainfo0v5 libzen0v5 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Install MEGAcmd
        run: |
          wget -q https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo dpkg -i megacmd-xUbuntu_22.04_amd64.deb || sudo apt-get -f install -y -qq

      - name: Publish Next Sitcom Vault Short
        env:
          YOUTUBE_TOKEN_SITCOM_VAULT: ${{ secrets.YOUTUBE_TOKEN_SITCOM_VAULT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/youtube_cloud_publisher.py --channel sitcom_vault --dry-run
          else
            python scripts/youtube_cloud_publisher.py --channel sitcom_vault --post-next
          fi
